<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="members_title">Lista de Miembros</title>
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/members.css">
  <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
  <link rel="stylesheet" href="../css/general.css">
</head>
<body>
  <div class="container">

    <div class="display-sidebar-container">
      <button id="display-sidebar">☰</button>
    </div>
    
    <!-- Sidebar dinámico -->
    <div id="sidebar"></div>

    <div class="background"></div>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1 class="titulo" data-translate="members_title">Lista de Miembros</h1>

      <!-- Sección de solicitudes aceptadas -->
      <section class="seccion">
        <h2 class="seccion-titulo aceptadas" data-translate="members_accepted_requests">Solicitudes Aceptadas</h2>
        <div class="tabla" id="tabla-miembros-aceptados">
          <div class="tabla-header">
            <span data-translate="members_name">Nombre</span>
            <span data-translate="members_membership_type">Tipo de Membresía</span>
            <span data-translate="members_accepted_date">Fecha Aceptada</span>
            <span></span>
          </div>
          <div class="tabla-body"></div>
          
        </div>
      </section>

      <!-- Sección de solicitudes rechazadas -->
      <section class="seccion">
        <h2 class="seccion-titulo rechazadas" data-translate="members_rejected_requests">Solicitudes Rechazadas</h2>
        <div class="tabla" id="tabla-miembros-rechazados">
          <div class="tabla-header">
            <span data-translate="members_name">Nombre</span>
            <span data-translate="members_membership_type">Tipo de Membresía</span>
            <span data-translate="members_requested_date">Fecha Solicitada</span>
            <span></span>
          </div>
          <div class="tabla-body">
            
          </div>
          
        </div>
      </section>

      <!-- Sección de solicitudes pendientes -->
      <section class="seccion">
        <h2 class="seccion-titulo pendientes" data-translate="members_pending_requests">Solicitudes Pendientes</h2>
        <div class="tabla" id="tabla-miembros-pendientes">
          <div class="tabla-header">
            <span data-translate="members_name">Nombre</span>
            <span data-translate="members_membership_type">Tipo de Membresía</span>
            <span data-translate="members_requested_date">Fecha Solicitada</span>
            <span></span>
          </div>
          <div class="tabla-body">

          </div>

        </div>
      </section>
    </main>
  </div>
</body>




<script type="module">
  
  import membersService from '../js/api/services/members.js';
  import loginService from '../js/api/services/login.js';

  const members = await membersService.get();
  

  const acceptedMembers = members.filter(member => member.estado === 'APROBADA');
  const rejectedMembers = members.filter(member => member.estado === 'RECHAZADA'); 
  const pendingMembers = members.filter(member => member.estado === 'PENDIENTE');

  const acceptedTable = document.getElementById('tabla-miembros-aceptados').getElementsByClassName('tabla-body')[0];
  const rejectedTable = document.getElementById('tabla-miembros-rechazados').getElementsByClassName('tabla-body')[0];
  const pendingTable = document.getElementById('tabla-miembros-pendientes').getElementsByClassName('tabla-body')[0];

  acceptedMembers.forEach(member => {
    const row = document.createElement('div');
    row.className = 'fila';
    row.innerHTML = `
      <span>${member.nombre_completo}</span>
      <span>${member.membresia}</span>
      <span>${new Date(member.fecha_solicitud).toLocaleDateString()}</span>
      <button class="btn-editar"><i class="fas fa-edit"></i>
        <a href="member_info.html?memberID=${member.usuario_id}">
          <span data-translate="members_edit">Editar</span>
        </a>
        </button>
    `;
    acceptedTable.appendChild(row);
  });

  rejectedMembers.forEach(member => {
    const row = document.createElement('div');
    row.className = 'fila';
    row.innerHTML = `
      <span>${member.nombre_completo}</span>
      <span>${member.membresia}</span>
      <span>${new Date(member.fecha_solicitud).toLocaleDateString()}</span>
      <button class="btn-editar"><i class="fas fa-edit"></i><a href="member_info.html?memberID=${member.usuario_id}">
        <span data-translate="members_edit">Editar</span>
        </a></button>
    `;
    rejectedTable.appendChild(row);
  });

  pendingMembers.forEach(member => {
    const row = document.createElement('div');
    row.className = 'fila';
    row.innerHTML = `
      <span>${member.nombre_completo}</span>
      <span>${member.membresia}</span>
      <span>${new Date(member.fecha_solicitud).toLocaleDateString()}</span>
      <button class="btn-editar"><i class="fas fa-edit"></i><a href="member_info.html?memberID=${member.usuario_id}">
        <span data-translate="members_edit">Editar</span>
        </a></button>
    `;
    pendingTable.appendChild(row);
  });

</script>

<script type="module" src="../js/modules/sidebar.js"></script>
<script type="module" src="../js/modules/verification.js"></script>


</html>
