<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="applications_title">Solicitudes de membresía</title>
  <link rel="stylesheet" href="../css/applications.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="../css/general.css">
</head>
<body>
    <div class="display-sidebar-container">
      <button id="display-sidebar">☰</button>
    </div>
    <div id="sidebar"></div> 

    <div class="background"></div>
    <div class="title-container" data-translate="applications_title">Solicitudes de membresía</div>

    <div class="table-container">
      <div class="table-box">
        <h3 data-translate="applications_table_title">Lista de membresías solicitadas</h3>
        <table id="membership_applications" class="display">
          <thead>
            <tr>
              <th data-translate="applications_member">MIEMBRO</th>
              <th data-translate="applications_membership_requested">MEMBRESIA  SOLICITADA</th>
              <th data-translate="applications_status">ESTADO</th>
              <th data-translate="applications_request_date">FECHA DE SOLICITUD</th>
              <th data-translate="applications_actions">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="membership_applications_body">
            
          </tbody> 
        </table>
      </div>
    </div>

    <!-- jQuery y DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/../js/jquery.dataTables.min.js"></script>

    <script type="module" src="../js/modules/theme.js"></script>
    <script type="module">
      import membershipApplicationService from '../js/api/services/membershipApplication.js';
      import loginService from '../js/api/services/login.js';

      const applications = await membershipApplicationService.obtener();
      const pendingApplications = applications.filter(application => application.estado === 'PENDIENTE');

      const ma_table = document.getElementById('membership_applications_body');
      ma_table.innerHTML = '';
      pendingApplications.forEach(application =>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><label class="name">${application.nombre_usuario}</label><br><label class="email">${application.email_usuario}</label></td>
          <td><label class="membership">${application.membresia}</label></td>
          <td><label class="status" data-translate="applications_status_${application.estado.toLowerCase()}">${application.estado}</label></td>
          <td><label>${new Date(application.fecha_solicitud).toLocaleDateString()}</label></td>
          <td>
            <button class="evaluate"><i class="fa-solid fa-file-fragment"></i><a href="application_info.html?application_id=${application.id}">
              <span data-translate="applications_evaluate">Evaluar</span>
              </a></button>
          </td>`;
        ma_table.appendChild(tr);
      }); 

      $(document).ready(function() {
          $('#membership_applications').DataTable({
              paging: true,       
              searching: true,    
              ordering: true,
              pageLength: 5,      
              lengthMenu: [5, 7, 10],   
              language: {
                  lengthMenu: "Mostrar _MENU_ registros por página",
                  zeroRecords: "No hay solicitudes de membresía nuevas",
                  info: "Mostrando página _PAGE_ de _PAGES_",
                  infoEmpty: "No hay registros disponibles",
                  infoFiltered: "(filtrado de _MAX_ registros en total)",
                  search: "Buscar:",
                  paginate: {
                      first: "Primero",
                      last: "Último",
                      next: "Siguiente",
                      previous: "Anterior"
                  }
              }
          });
      });
    </script>


    
</body>
<script type="module" src="../js/modules/sidebar.js"></script>
<script type="module" src="../js/modules/verification.js"></script>

</html>
