<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="applications_title">Solicitudes de membresía</title>
  <link rel="stylesheet" href="../css/applications.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
  <link rel="stylesheet" href="../css/general.css">
</head>
<body>
    <div class="display-sidebar-container">
      <button id="display-sidebar">☰</button>
    </div>
    <div id="sidebar"></div> 

    <div class="background"></div>
    <div class="title-container" data-translate="applications_title">Solicitudes de membresía</div>

    <div class="table-container">
      <div class="table-box">
        <h3 data-translate="applications_table_title">Lista de membresías solicitadas</h3>
        <table id="membership_applications" class="display">
          <thead>
            <tr>
              <th data-translate="applications_member">MIEMBRO</th>
              <th data-translate="applications_membership_requested">MEMBRESIA  SOLICITADA</th>
              <th data-translate="applications_status">ESTADO</th>
              <th data-translate="applications_request_date">FECHA DE SOLICITUD</th>
              <th data-translate="applications_actions">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="membership_applications_body">
            
          </tbody> 
        </table>
        <div class="pagination-controls" id="applications-pagination"></div>
      </div>
    </div>

    <script type="module" src="../js/modules/theme.js"></script>
    <script type="module" src="../js/modules/applications.js"></script>


    
</body>
<script type="module" src="../js/modules/sidebar.js"></script>
<script type="module" src="../js/modules/verification.js"></script>

</html>
