<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="application_info_title">Evaluación del candidato</title>
    <link rel="stylesheet" href="../css/application_info.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
    <link rel="stylesheet" href="../css/general.css">
</head>
<body>
    <div class="display-sidebar-container">
        <button id="display-sidebar">☰</button>
    </div>
   
    <div id="sidebar"></div>

    <div class="main-container">

        <div class="title-container">
            <i id="go-back-btn" class="fa-solid fa-angle-left"></i>
            <span>Evaluación del candidato</span>
        </div>

        <div id="general-info">
            <div class="panel" id="general-info-panel">
                <div id="applicant-profile">
                    <span id="applicant-name"></span>
                    <span id="applicant-career">Ingeniería de Software</span>
                </div>
                <div id="application-data">
                    <div>
                        <h4>Fecha de la solicitud</h4>
                        <span id="application-date"></span>
                    </div>
                    <div>
                        <h4>Membresía solicitada</h4>
                        <span id="requested-membership"></span>
                    </div>
                    <div>
                        <h4>Estado de la solicitud</h4>
                        <span id="application-status"></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="applicant-info">
            <div class="panel" id="applicant-info-panel">
                <h3>Información del candidato</h3>
                <div class="applicant-data-tag">
                    <i class="fa-solid fa-envelope"></i>
                    <label for="applicant-email">Email:</label>
                    <span id="applicant-email"></span>
                </div>
                <div class="applicant-data-tag">
                    <i class="fa-solid fa-flag"></i>
                    <label for="applicant-country">País:</label>
                    <span id="applicant-country"></span>
                </div>
                <div class="applicant-data-tag">
                    <i class="fa-solid fa-location-dot"></i>
                    <label for="applicant-state">Estado:</label>
                    <span id="applicant-state"></span>
                </div>
                <div class="applicant-data-tag">
                    <i class="fa-solid fa-building-columns"></i>
                    <label for="applicant-university">Universidad:</label>
                    <span id="applicant-university"></span>
                </div>
                <div class="applicant-data-tag">
                    <i class="fa-solid fa-book"></i>
                    <label for="applicant-investigation-area">Área de investigación:</label>
                    <span id="applicant-investigation-area"></span>
                </div>

                <hr>

                <h3>Comentarios:</h3>
                <span id="applicant-comments"></span>

                <hr>

                <div id="buttons-container">
                    <button class="application-btn" id="open-approve-modal">
                        <span>Aprobar solicitud</span>
                    </button>
                    <button class="application-btn" id="open-reject-modal">
                        <span>Rechazar solicitud</span>
                    </button>
                </div>
            </div>
            <div class="panel" id="cv-panel">
                <div id="cv-panel-header">
                    <h3>Curriculum Vitae</h3>

                    <button id="download-cv">
                        <i class="fa-solid fa-download"></i>
                        <a href="" target="_blank">Descargar</a>
                    </button>
                </div>
                <iframe id="iframe-cv" src="" frameborder="0"></iframe>
            </div>
        </div>

        <!--Modal de rechazo de solicitud-->
        <div id="reject-application-modal" class="modal">
            <div id="reject-modal-content" class="modal-content">
                <span id="close-reject-btn" class="close-modal">
                    &times;
                </span>

                <div class="form-wrapper">
                    <div class="form-box">
                        <h3>Rechazar solicitud de membresía</h3>
                        <div id="form-container" class="form-container">
                            <label for="rejection-reason" >Escriba el motivo del rechazo:</label>
                            <textarea id="rejection-reason" rows="5" placeholder="Motivo de rechazo..."></textarea>
                        </div>

                        <div class="modal-btn-container">
                            <button id="accept-rejection" type="button" class="modal-btn accept-btn">
                                <span>Rechazar</span>
                            </button>

                            <button id="cancel-rejection" type="button" class="modal-btn cancel-btn">
                                <span>Cancelar</span>
                            </button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>


        <!--Modal de aprobación de solicitud-->
        <div id="accept-application-modal" class="modal">
            <div id="accept-modal-content" class="modal-content">
                <span id="close-approve-btn" class="close-modal">
                    &times;
                </span>

                <div class="form-wrapper">
                    <div class="form-box">
                        <h3>Aprobar solicitud de membresía</h3>
                        <div id="form-container">
                            <label for="accept-comments" >Escriba comentarios para el solicitante (opcional):</label>
                            <textarea id="accept-comments" rows="5" placeholder="Comentarios para el solicitante..."></textarea>
                        </div>

                    <div class="modal-btn-container">
                            <button id="accept-approvement" type="button" class="modal-btn accept-btn">
                                <span>Aprobar</span>
                            </button>

                            <button id="cancel-approvement" type="button" class="modal-btn cancel-btn">
                                <span>Cancelar</span>
                            </button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>


        
    </div>



</body>
<script type="module" src="../js/modules/application_info.js"></script>
<script type="module" src="../js/modules/verification.js"></script>
<script type="module" src="../js/modules/sidebar.js"></script>
</html>
