<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="profile_title">Perfil</title>
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
</head>
<body>
  <div class="display-sidebar-container">
    <button id="display-sidebar">☰</button>
  </div>

  <div id="sidebar"></div> 

  <div class="background"></div>

  <div class="main-container">
    <div class="title-container">
      <h2 data-translate="profile_title">Perfil</h2>
    </div>

    <div class="form-container">
      <div class="form-box">
        <label data-translate="profile_name">Nombre</label>
        <input id="nombre" type="text" placeholder="Nombre" disabled>
        <label data-translate="profile_lastname">Apellido(s)</label>
        <input id="apellidos" type="text" placeholder="Apellido(s)" disabled>
        <label data-translate="profile_gender">Género</label>
        <input id="genero" type="text" placeholder="Género" disabled>
        <label data-translate="profile_university">Universidad</label>
        <div id="universidad-container">
          <input id="universidad" type="text" placeholder="Universidad" disabled>
        </div>
      </div>
      <div class="form-box">
        <label data-translate="profile_state">Estado</label>
        <div id="estado-container">
          <input id="estado" type="text" placeholder="Estado" disabled>
        </div>
        <label data-translate="profile_country">País</label>
        <div id="pais-container">
          <input id="pais" type="text" placeholder="País" disabled>
        </div>
        <label data-translate="profile_email">Email</label>
        <input id="email" type="email" placeholder="Email" disabled>
        <label data-translate="profile_password">Contraseña</label>
        <input id="password" type="password" placeholder="Contraseña" disabled>
      </div>
    </div>
    <div class="edit-button-container">
      <button class="edit-button" id="editBtn">
        <span data-translate="profile_edit">Editar</span>
      </button>
      <button class="edit-button" id="acceptBtn" style="display: none;">
        <span data-translate="profile_accept">Aceptar</span>
      </button>
      <button class="cancel-Btn" id="cancelBtn" style="display: none;">
        <span data-translate="profile_cancel">Cancelar</span>
      </button>
    </div>
  </div>

  <script type="module" src="../js/modules/sidebar.js"></script>
  
  <script type="module" src="../js/modules/profile.js"></script>

  <script type="module" src="../js/modules/verification.js"></script>

</body>

</html>
