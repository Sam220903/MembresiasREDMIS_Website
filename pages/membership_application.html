<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="membership_application_title">Solicitud de Membresía</title>
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/application_membership.css">
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
</head>
<body>
    <div class="display-sidebar-container">
        <button id="display-sidebar">☰</button>
    </div>

    <div id="sidebar"></div> 

    <div class="background"></div>
    <div class="title-container">
        <h2 data-translate="membership_application_title">Solicitud de Membresía</h2>
    </div>

    <div class="form-container">
      <div class="form-box" style="width: 700px;">
        <label data-translate="membership_application_type">Tipo de Membresía</label>
        <select id="tipo-membresia" class="custom-select" required>
          <option value="" disabled selected data-translate="membership_select">Selecciona una membresía</option>
        </select>

        <label data-translate="membership_application_phone">Teléfono</label>
        <input type="tel" id="telefono" class="custom-input" required>

        <label data-translate="membership_application_comments">Comentarios</label>
        <textarea id="comentarios" class="custom-textarea" rows="4"></textarea>


        <label data-translate="membership_application_cv">CV Actual (PDF)</label>
        <div id="cv-current-info">
          <p id="cv-status-text" data-translate="profile_cv_none">Aún no has subido un CV.</p>
          <iframe id="cv-preview" src="" frameborder="0" style="display: none;"></iframe>
        </div>
        <label for="cv-file" id="cv-file-label" data-translate="membership_application_cv_replace">Subir un CV nuevo (opcional si ya tienes uno cargado)</label>
        <input type="file" id="cv-file" class="custom-input" accept=".pdf">

        <button id="submit-membership" class="custom-button" type="button">
            <span data-translate="membership_application_submit">Enviar Solicitud</span>
        </button>
      </div>
    </div>

    <script type="module" src="../js/modules/theme.js"></script>
    <script type="module" src="../js/modules/membership_application.js"></script>
    <script type="module" src="../js/modules/verification.js"></script>
    <script type="module" src="../js/modules/sidebar.js"></script>
</body>
</html>
