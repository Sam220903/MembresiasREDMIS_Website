<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="settings-title">Ajustes</title>
  <link rel="stylesheet" href="../css/settings.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="../css/general.css">
</head>
<body>
    <div class="display-sidebar-container">
      <button id="display-sidebar">☰</button>
    </div>
    <div id="sidebar"></div> 

    <div class="background"></div>
    

    <div class="main-container">

      <div data-translate="settings-title" class="title-container">Ajustes</div>

      <div class="theme-settings">
          <div class="theme-description">
            <h3 data-translate="settings-theme">Tema</h3>
            <p data-translate="settings-theme-description">Apariencia del sistema, incluyendo colores, tipografía y otros elementos visuales.</p>
          </div>
          <div class="theme-options">
              <button id="system-theme-btn">
                <i class="fa-solid fa-laptop"></i>
                <span data-translate="settings-theme-system">Sistema</span>
              </button>
              <button id="light-theme-btn">
                <i class="fa-regular fa-sun"></i>
                <span data-translate="settings-theme-light">Claro</span>
              </button>
              <button id="dark-theme-btn">
                <i class="fa-regular fa-moon"></i>
                <span data-translate="settings-theme-dark">Oscuro</span>
              </button>
          </div>
      </div>

      <div class="language-settings">
          <div class="language-description">
            <h3 data-translate="settings-language">Idioma</h3>
            <p data-translate="settings-language-description">Selecciona el idioma en el que deseas usar la plataforma.</p>
          </div>
          <div class="language-options">
              <button id="spanish-btn">
                <i class="fa-solid fa-language"></i>
                <span data-translate="settings-language-spanish">Español</span>
              </button>
              <button id="english-btn">
                <i class="fa-solid fa-language"></i>
                <span data-translate="settings-language-english">Inglés</span>
              </button>
          </div>
      </div>

      <div class="entities-settings">
          <div class="entities-description">
            <h2 data-translate="settings-entities">Entidades</h2>
          </div>
          <div class="entities-options">

              <div class="countries-panel">
                <h3 data-translate="settings-countries">Países</h3>
                <div id="search-country">
                  <div id="found-countries" class="found-items-container">
                    <input type="text" id="searchCountry" placeholder="Buscar país...">
                    <ul id="countries-list" class="container-suggestions">
                      <!-- Aquí se mostrarán los países sugeridos -->
                    </ul>
                  </div>

                  <button id="add-country-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
              </div>

              <div class="states-panel">
                <h3 data-translate="settings-states">Estados</h3>
                <div id="search-state">
                  <div id="found-states" class="found-items-container">
                    <input type="text" id="searchState" placeholder="Buscar estado...">
                    <ul id="states-list" class="container-suggestions">
                      <!-- Aquí se mostrarán los estados sugeridos -->
                    </ul>
                  </div>
                  <button id="add-state-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
              </div>

              <div class="universities-panel">
                <h3 data-translate="settings-universities">Universidades</h3>
                <div id="search-university">
                  <div id="found-universities" class="found-items-container">
                    <input type="text" id="searchUniversity" placeholder="Buscar universidad...">
                    <ul id="universities-list" class="container-suggestions">
                      <!-- Aquí se mostrarán las universidades sugeridas -->
                    </ul>
                  </div>
                  <button id="add-university-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
              </div>

          </div>
      </div>
    </div>

    <div id="addCountryModal"></div>
    <div id="addStateModal"></div>
    <div id="addUniversityModal"></div>

    
</body>

<script type="module" src="../js/modules/sidebar.js"></script>
<script type="module" src="../js/modules/settings.js"></script>
<script type="module" src="../js/modules/verification.js"></script>
<script type="module" src="../js/modules/translate.js"></script>


</html>
