<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="members_title">Lista de Miembros</title>
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/members.css">
  <link rel="stylesheet" href="../../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
  <link rel="stylesheet" href="../../css/general.css">
</head>
<body>
  <div class="container">

    <div class="display-sidebar-container">
      <button id="display-sidebar">☰</button>
    </div>
    
    <!-- Sidebar dinámico -->
    <div id="sidebar"></div>

    <div class="background"></div>

    <!-- Contenido principal -->
    <main class="main-content">

      <div class="title-container">
        <i id="go-back-btn" class="fa-solid fa-angle-left"></i>
        <a href="../management/">Gestión</a>
        /
        <span data-translate="members_title">Lista de Miembros</span>
      </div>

      <!-- Sección de miembros -->
      <section class="seccion">
        <div class="members-table-box">
          <h3 data-translate="members_table_title">Lista de miembros registrados</h3>
          <table id="members_table" class="display">
            <thead>
              <tr>
                <th data-translate="members_name">Nombre</th>
                <th data-translate="members_membership">Membresía</th>
                <th data-translate="members_email">Correo Electrónico</th>
                <th data-translate="members_role">Rol</th>
                <th data-translate="members_actions">Acciones</th>
              </tr>
            </thead>
            <tbody id="members_body"></tbody>
          </table>
          <div class="pagination-controls" id="members-pagination"></div>
        </div>
      </section>
    </main>
  </div>
</body>




<script type="module" src="../../js/modules/theme.js"></script>
<script type="module" src="../../js/modules/members.js"></script>

<script type="module" src="../../js/modules/sidebar.js"></script>
<script type="module" src="../../js/modules/verification.js"></script>


</html>
