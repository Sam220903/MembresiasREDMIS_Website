<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="members_title">Lista de Miembros</title>
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/members.css">
  <link rel="stylesheet" href="../../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
  <link rel="stylesheet" href="../../css/general.css">
</head>
<body>
  <div class="container">

    <div class="display-sidebar-container">
      <button id="display-sidebar">☰</button>
    </div>
    
    <!-- Sidebar dinámico -->
    <div id="sidebar"></div>

    <div class="background"></div>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1 class="titulo" data-translate="members_title">Lista de Miembros</h1>

      <!-- Sección de solicitudes -->
      <section class="seccion">
        <div class="tabla" id="tabla-miembros">
          <div class="tabla-header">
            <span data-translate="members_name">Nombre</span>
            <span data-translate="members_email">Correo electronico</span>
            <span data-translate="members_role">Rol</span>
            <span></span>
          </div>
          <div class="tabla-body"></div>
          
        </div>
      </section>
    </main>
  </div>
</body>




<script type="module" src="../../js/modules/theme.js"></script>
<script type="module" src="../../js/modules/member.js"></script>

<script type="module" src="../../js/modules/sidebar.js"></script>
<script type="module" src="../../js/modules/verification.js"></script>


</html>
