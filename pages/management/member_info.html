<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="member_info_title">Miembros</title>
    <link rel="stylesheet" href="../../css/member_info.css">
    <link rel="stylesheet" href="../../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/general.css">
</head>
<body>

<div class="display-sidebar-container">
    <button id="display-sidebar">☰</button>
</div>

<div id="sidebar"></div>

<div class="content">
    <h1 data-translate="member_info_title" class="title-container">Información del miembro</h1>
    <div class="user-card">
        <div class="user-header">
            <i class="fas fa-user-circle"></i> 
            <span data-translate="member_info_user">Usuario</span>
        </div>
        <div class="user-details">
            <div class="info-group">
                <label data-translate="member_info_id">ID</label>
                <input id="member-id" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_name">Nombre Completo</label>
                <input id="member-name" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_gender">Género</label>
                <input id="member-gender" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_user_type">Tipo de Usuario</label>
                <input id="member-usertype" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_status">Estatus</label>
                <input id="member-status" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_country">País</label>
                <input id="member-country" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_state">Estado</label>
                <input id="member-state" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_university">Universidad</label>
                <input id="member-university" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_register_date">Fecha de Registro</label>
                <input id="member-register-date" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_last_access">Fecha de Acceso</label>
                <input id="member-last-access" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_last_update">Última Actualización</label>
                <input id="member-last-update" type="text" value="" disabled>
            </div>
            <div class="info-group">
                <label data-translate="member_info_role">Rol</label>
                <div class="role-toggle-group">
                    <label id="role-label" class="role"></label>
                    <div class="toggle-container">
                        <label class="toggle-switch">
                            <input type="checkbox" id="turn-to-admin" class="turn-to-admin">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-primary"> <i class="fas fa-download"></i> <a id="download-cv" href="" download="">
                <span data-translate="member_info_download_cv">Descargar CV</span>
            </a></button>
            <button id="change-membership-status" class="btn"> <i class="fas fa-times"></i> </button>
            <button id="delete-user" class="btn btn-danger"> <i class="fas fa-trash"></i> 
                <span data-translate="member_info_delete_user">Eliminar Usuario</span>
            </button>
        </div>
    </div>
    </div>

    <script type="module" src="../../js/modules/theme.js"></script>
    <script type="module" src="../../js/modules/member_info.js"></script>

</body>

<script type="module" src="../../js/modules/sidebar.js"></script>
<script type="module" src="../../js/modules/verification.js"></script>




</html>
