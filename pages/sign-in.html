<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../css/sign-in.css">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
</head>
<body>
    <div class="form-container">
        <h2 class="title">¡Bienvenido!</h2>
        <p class="subtitle">Ingresa la siguiente información para crear una nueva cuenta</p>
        <form id="register-form" autocomplete="off">
            <div class="form-grid">
                <div id="name-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="input-field"  required>
                </div>
                <div id="last-name-field">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" class="input-field" required>
                </div>
                <div id="gender-field">
                    <label for="genero">Género</label>
                    <select id="genero" name="genero" class="input-field" required>
                        <option value="" disabled selected>Selecciona tu género</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                 <div id="country-field">
                    <label for="pais">País</label>
                    <select id="pais-select" name="pais-select" class="input-field" required>
                        <option value="" selected disabled>Selecciona tu país</option>
                    </select>
                </div>
                <div id="state-field">
                    <label for="estado">Estado</label>
                    <select id="estado-select" name="estado-select" class="input-field" required>
                        <option value="" selected disabled>Selecciona tu estado</option>
                    </select>
                </div>
                <div id="university-field">
                    <label for="universidad">Universidad</label>
                    <select id="universidad-select" name="universidad" class="input-field" required>
                        <option value="" selected disabled>Selecciona tu universidad</option>
                    </select>       
                </div>
                <div id="email-field">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="input-field" required>
                </div>
                <div class="input-container" id="password-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="input-field" required>
                    <i class="fa-solid fa-eye" id="toggle-password"></i>
                </div>

                <div class="input-container" id="password-confirmation-field">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="input-field" required>
                </div>

                <div class="info-container">
                    <span id="confirm-password-info"></span>
                </div>
               
            </div>
            <div class="button-container">
                <button type="submit" class="button">Crear Cuenta</button>
            </div>
        </form>
        <p class="login-link">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>


</body>
<script type="module" src="../js/modules/sign-in.js"></script>
</html>
