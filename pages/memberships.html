<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <title data-translate="membership_title">Membresías</title>
  <link rel="stylesheet" href="../css/memberships.css">
  <link rel="stylesheet" href="../../assets/icons/css/all.min.css"> <!-- Estilos de font-awesome -->
  <!-- Asegurarnos de que jsPDF está cargado correctamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/general.css">
</head>
<body>
  <div class="display-sidebar-container">
    <button id="display-sidebar">☰</button>
  </div>

  <div id="sidebar"></div> 

  <div class="background"></div>

  <div class="title-container" data-translate="membership_title">Membresías</div>

  <main class="content">
    <header>
      <!-- Espacio para header si es necesario -->
    </header>

    <section class="membership-table">
      <table>
        <thead>
            <tr>
                <th data-translate="membership_code">Código de membresía</th>
                <th data-translate="membership_member_since">Miembro desde</th>
                <th data-translate="membership_valid_until">Válido hasta</th>
                <th data-translate="membership_type">Tipo</th>
                <th data-translate="membership_status">Estado</th>
                <th data-translate="membership_action">Acción</th> <!-- Cambiado a "Acción" para ser más genérico -->
            </tr>
        </thead>
        <tbody>
            <!-- Las filas se generarán dinámicamente con JavaScript -->
        </tbody>
      </table>
    </section>
  </main>


  
</body>
<script type="module" src="../js/modules/theme.js"></script>
<script type="module" src="../js/modules/sidebar.js"></script>
<script type="module" src="../js/modules/membresias.js"></script>
<script type="module" src="../js/modules/verification.js"></script>


</html>
